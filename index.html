<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MothMod</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      margin-top: 60px;
    }

    .moth-img {
      width: 220px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .login-btn, .logout-btn {
      padding: 12px 20px;
      background: #6a5acd;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 20px;
    }

    .login-btn:hover, .logout-btn:hover {
      background: #4b3bb3;
    }

    .username {
      font-size: 26px;
      margin-top: 20px;
      color: #333;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>MothMod</h1>

    <!-- Where login status appears -->
    <div id="status"></div>

    <!-- Login button -->
    <button class="login-btn" id="loginBtn">Login</button>

    <!-- Logout button -->
    <button class="logout-btn" id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <script>
    // Initialize Supabase
    const supabase = supabase.createClient(
      "YOUR_SUPABASE_URL",
      "YOUR_SUPABASE_ANON_KEY"
    );

    const statusDiv = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();

      if (!user) {
        // Not logged in
        statusDiv.innerHTML = "<h2>Guest</h2>";
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
      } else {
        // Logged in
        statusDiv.innerHTML = `
          <img class="moth-img" src="mothmod_profile.jpg">
          <div class="username">Hello, 🦋 ${user.email}</div>
        `;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
      }
    }

    // Login with Supabase magic link
    loginBtn.addEventListener("click", async () => {
      const email = prompt("Enter your email to login:");
      if (!email) return;

      await supabase.auth.signInWithOtp({ email });
      alert("Your magic link is sent! Check your email.");
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      checkUser();
    });

    // Check login on page load
    checkUser();
  </script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MothMod — Community Projects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🐛 MothMod Community Projects</h1>
    <p>Explore creations from around the world.</p>
  </header>

  <!-- Country Selector -->
  <section id="country-select">
    <label for="country">🌍 Choose a country:</label>
    <select id="country">
      <option value="all">All Countries</option>
      <option value="usa">United States</option>
      <option value="uk">United Kingdom</option>
      <option value="canada">Canada</option>
      <option value="japan">Japan</option>
      <option value="germany">Germany</option>
      <option value="france">France</option>
      <option value="australia">Australia</option>
      <option value="brazil">Brazil</option>
    </select>
  </section>

  <!-- Community Projects -->
  <section id="projects" class="project-list">
    <!-- Auto-loaded from projects.json -->
  </section>

  <script>
    // Load projects.json
    fetch("projects.json")
      .then(res => res.json())
      .then(projects => {
        const container = document.getElementById("projects");
        const countrySelect = document.getElementById("country");

        function renderProjects(filter = "all") {
          container.innerHTML = "";

          projects
            .filter(p => filter === "all" || p.country === filter)
            .forEach(p => {
              const div = document.createElement("div");
              div.className = "project";

              div.innerHTML = `
                <img src="${p.thumbnail}" class="thumbnail">
                <h2>${p.name}</h2>
                <p>${p.description}</p>
                <p class="country">🌍 ${p.country}</p>
                <a href="${p.url}" target="_blank">Visit Project</a>
                <a href="${p.remix}" target="_blank" class="remix-btn">Remix</a>
              `;

              container.appendChild(div);
            });
        }

        // Initial load
        renderProjects();

        // Filter by country
        countrySelect.addEventListener("change", () => {
          renderProjects(countrySelect.value);
        });
      });
  </script>

</body>
</html>
